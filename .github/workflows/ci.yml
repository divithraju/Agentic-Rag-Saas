name: ci
on:
  workflow_dispatch:
  pull_request:
jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff httpx && ruff check backend evals
      - name: Start stack
        run: cp .env.example .env && docker compose up -d --build
        env: { ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
      - name: Seed + ingest sample docs
        run: echo "TODO: docker compose exec api python -m app.seed && python scripts/load_sample_docs.py"
      - name: Eval gate (fails PR on quality regression)
        run: python evals/run_evals.py
        env: { ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
